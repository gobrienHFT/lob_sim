[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lob-sim"
version = "0.2.0"
description = "Auditable Binance USD-M market-by-price replay and execution-research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "python-dotenv>=1.0,<2",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
lob-sim = "lob_sim.cli:main"
lob-benchmark = "lob_sim.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["lob_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "RUF"]
