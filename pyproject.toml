[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-sim"
version = "0.1.0"
description = "Deterministic Binance USD-M replay, queue-aware passive-fill simulation, and a controlled dealer-pricing case study"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "lob_sim contributors" },
]
keywords = ["limit-order-book", "market-microstructure", "replay", "market-making", "binance-futures"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.9",
  "websockets>=12.0",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
lob-sim = "lob_sim.cli:main"

[tool.setuptools.packages.find]
include = ["lob_sim*"]

[tool.setuptools.package-data]
lob_sim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
