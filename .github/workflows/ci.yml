name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: CLI smoke test
        run: python -m lob_sim.cli --help

      - name: Run tests
        run: python -m pytest -q

      - name: Type check core replay and simulation modules
        run: python -m mypy lob_sim/book lob_sim/replay lob_sim/sim/fill_model.py lob_sim/sim/engine.py lob_sim/sim/metrics.py

      - name: Run ruff lint
        run: python -m ruff check .

      - name: Check ruff formatting
        run: python -m ruff format --check .

      - name: Check deterministic futures fixture
        run: python scripts/check_futures_determinism.py --file docs/sample_outputs/futures_replay_walkthrough/input_fixture.ndjson --env .env.example

      - name: Audit committed futures packs
        run: python scripts/audit_futures_pack.py --committed-futures

      - name: Verify committed artifacts
        run: python scripts/verify_committed_artifacts.py

      - name: Check whitespace
        run: git diff --check

      - name: Run Makefile reviewer gate
        run: make reviewer-gate
