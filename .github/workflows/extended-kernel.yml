name: Extended kernel differential

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

concurrency:
  group: extended-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  differential:
    name: Kernel corpus seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 73, 101]
    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.82.0 --profile minimal --component rustfmt --component clippy --force --no-self-update

      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Record source revision
        run: git rev-parse HEAD

      - name: Compare 100000 generated cases per kernel primitive
        run: python scripts/check_rust_python_parity.py --cases 100000 --seed ${{ matrix.seed }} --json-out outputs/kernel_parity_seed_${{ matrix.seed }}.json

      - name: Publish differential hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-parity-seed-${{ matrix.seed }}
          path: outputs/kernel_parity_seed_${{ matrix.seed }}.json
          if-no-files-found: warn
